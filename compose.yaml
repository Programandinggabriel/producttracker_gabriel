services:
  postgres:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  redis:
    image: redis:latest
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:5000:5000"
  cron:
    build: ./backend
    command: node cron/cron.js
  frontend:
    build: ./frontend/product-tracker
    ports:
      - "127.0.0.1:3000:3000"