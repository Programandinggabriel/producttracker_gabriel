services:
  postgres:
    image: postgres:18
    ports:
      - "5433:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:latest
    restart: unless-stopped
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
  cron:
    build: ./backend
    environment:
      - DB_HOST=postgres
      - TZ=America/Bogota
    command: node cron/cron.js
    restart: unless-stopped
  frontend:
    build: ./frontend/product-tracker
    env_file:
      - ./frontend/product-tracker/.env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  postgres_data:
  